name: Feature request / 功能建议
description: Describe a concrete workflow and the improvement needed.
body:
  - type: textarea
    id: workflow
    attributes:
      label: 使用场景与问题 / Workflow and problem
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 改进建议 / Suggested improvement
    validations:
      required: true
